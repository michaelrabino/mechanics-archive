<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ארכיון שאלות - מכניקה</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- ייבוא MathJax לתצוגת משוואות -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header>
        <h1>ארכיון שאלות - מכניקה</h1>
        <p>מאגר שאלות מתוך בחינות - פתרונות מלאים מופיעים בלחיצה</p>
    </header>

    <main>
        <aside class="filters">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="חיפוש לפי מילות מפתח, נושא או תוכן השאלה...">
                <button id="searchBtn" class="btn-search">חפש</button>
            </div>
            
            <div class="filter-group">
                <select id="yearFilter">
                    <option value="">כל השנים</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                </select>

                <select id="semesterFilter">
                    <option value="">כל הסמסטרים</option>
                    <option value="א">סמסטר א'</option>
                    <option value="ב">סמסטר ב'</option>
                    <option value="קיץ">קיץ</option>
                </select>
            </div>
        </aside>

        <!-- אזור התוצאות -->
        <section id="results" class="results-list">
            <!-- השאלות יוזרקו לכאן -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
